<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="front" x1="0%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#cce8ff"/>
    </linearGradient>
    <linearGradient id="side" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#5588bb"/>
      <stop offset="100%" style="stop-color:#224477"/>
    </linearGradient>
  </defs>

  <!-- Shadow -->
  <g opacity="0.25" transform="translate(5,6)">
    <polygon points="72,8 98,8 62,58 86,58 30,118 56,68 34,68" fill="black"/>
  </g>

  <!-- Right depth face of lightning bolt -->
  <polygon points="98,8 106,12 70,62 94,62 38,122 46,118 88,62 64,62" fill="url(#side)"/>

  <!-- Front face: lightning bolt -->
  <polygon points="72,8 98,8 62,58 86,58 30,118 56,68 34,68 68,16"
           fill="url(#front)" filter="url(#glow)"/>
  <polygon points="72,8 98,8 62,58 86,58 30,118 56,68 34,68 68,16"
           fill="url(#front)" filter="url(#glow)"/>

  <!-- Speed lines behind bolt -->
  <line x1="14" y1="38" x2="40" y2="38" stroke="#aaddff" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="10" y1="54" x2="30" y2="54" stroke="#aaddff" stroke-width="2" stroke-linecap="round" opacity="0.45"/>
  <line x1="16" y1="70" x2="32" y2="70" stroke="#aaddff" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>

  <!-- Highlight -->
  <line x1="72" y1="8" x2="62" y2="58" stroke="#ddeeff" stroke-width="1.5" opacity="0.6"/>
</svg>
